<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-label="Snipping a region with the system snipper, then the screenshot sitting in the composer with three model actions">
  <defs>
    <clipPath id="panelA"><rect x="40" y="96" width="600" height="420" rx="16"/></clipPath>
    <clipPath id="panelB"><rect x="640" y="96" width="600" height="420" rx="16"/></clipPath>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2440"/>
      <stop offset="1" stop-color="#0e1424"/>
    </linearGradient>
    <mask id="dim">
      <rect x="40" y="96" width="600" height="420" fill="#fff"/>
      <rect x="128" y="188" width="352" height="192" rx="6" fill="#000"/>
    </mask>
    <style>
      .cap{font:600 15px "Segoe UI",system-ui,sans-serif;fill:#5b6472}
      .sub{font:400 13px "Segoe UI",system-ui,sans-serif;fill:#8a93a3}
      .badge{font:600 12px "Segoe UI",system-ui,sans-serif;fill:#fff}
      .chip{font:500 13px "Segoe UI",system-ui,sans-serif;fill:#1f2430}
      .cardtitle{font:400 12px "Segoe UI",system-ui,sans-serif;fill:#6b7385}
      .send{font:600 13px "Segoe UI",system-ui,sans-serif;fill:#fff}
    </style>
  </defs>

  <rect width="1280" height="680" fill="#f6f7fb"/>

  <!-- scene 1: the system snipper, live desktop behind it -->
  <text class="cap" x="40" y="66">1 · 拖选区域（覆盖所有显示器）</text>
  <g clip-path="url(#panelA)">
    <rect x="40" y="96" width="600" height="420" fill="url(#desk)"/>
    <!-- a couple of background windows so the desktop reads as live -->
    <rect x="76" y="132" width="250" height="160" rx="8" fill="#243252" opacity=".9"/>
    <rect x="92" y="150" width="150" height="9" rx="4" fill="#4a5c88"/>
    <rect x="92" y="170" width="200" height="6" rx="3" fill="#33456d"/>
    <rect x="92" y="186" width="176" height="6" rx="3" fill="#33456d"/>
    <rect x="92" y="202" width="206" height="6" rx="3" fill="#33456d"/>
    <rect x="356" y="250" width="250" height="150" rx="8" fill="#1e2b47" opacity=".9"/>
    <rect x="372" y="268" width="130" height="9" rx="4" fill="#42547e"/>
    <rect x="372" y="288" width="190" height="6" rx="3" fill="#2c3d61"/>
    <rect x="372" y="304" width="160" height="6" rx="3" fill="#2c3d61"/>
    <!-- the snipper dims everything except the pick -->
    <rect x="40" y="96" width="600" height="420" fill="#05080f" opacity=".62" mask="url(#dim)"/>
    <rect x="128" y="188" width="352" height="192" rx="6" fill="none" stroke="#3d5afe" stroke-width="2"/>
    <!-- corner ticks -->
    <g stroke="#3d5afe" stroke-width="3" stroke-linecap="round">
      <path d="M128 202v-14h14"/><path d="M466 188h14v14"/><path d="M128 366v14h14"/><path d="M480 380v-14h-14"/>
    </g>
    <!-- size badge right under the selection -->
    <rect x="128" y="390" width="92" height="24" rx="6" fill="#3d5afe"/>
    <text class="badge" x="140" y="406">352 × 192</text>
    <!-- the snipper's own little toolbar -->
    <rect x="392" y="418" width="216" height="34" rx="10" fill="#0d1322" opacity=".92" stroke="#2b3860"/>
    <circle cx="412" cy="435" r="7" fill="none" stroke="#8fa2d6" stroke-width="1.6"/>
    <rect x="428" y="431" width="46" height="8" rx="4" fill="#546a9c"/>
    <rect x="486" y="431" width="46" height="8" rx="4" fill="#546a9c"/>
    <rect x="544" y="431" width="46" height="8" rx="4" fill="#546a9c"/>
  </g>
  <text class="sub" x="40" y="542">松手即完成；按 Esc 或右键取消</text>

  <!-- scene 2: the composer with the attachment and the actions -->
  <text class="cap" x="640" y="66">2 · 自动进入输入框，等待发送</text>
  <g clip-path="url(#panelB)">
    <rect x="640" y="96" width="600" height="420" fill="#ffffff"/>
    <!-- success card -->
    <rect x="700" y="124" width="480" height="92" rx="14" fill="#ffffff" stroke="#dfe3ec"/>
    <rect x="714" y="138" width="64" height="64" rx="8" fill="#c9d3ea" stroke="#c3cbdd"/>
    <circle cx="746" cy="170" r="12" fill="#eef2fb"/>
    <rect x="792" y="140" width="150" height="10" rx="5" fill="#c8cfdd"/>
    <rect x="792" y="164" width="74" height="26" rx="13" fill="#eef1f8" stroke="#dde2ee"/>
    <text class="chip" x="806" y="181">识别文字</text>
    <rect x="874" y="164" width="56" height="26" rx="13" fill="#eef1f8" stroke="#dde2ee"/>
    <text class="chip" x="888" y="181">翻译</text>
    <rect x="938" y="164" width="82" height="26" rx="13" fill="#eef1f8" stroke="#dde2ee"/>
    <text class="chip" x="952" y="181">描述内容</text>
    <path d="M1158 144l12 12M1170 144l-12 12" stroke="#9aa3b4" stroke-width="1.8" stroke-linecap="round"/>
    <!-- composer -->
    <rect x="676" y="300" width="528" height="140" rx="18" fill="#ffffff" stroke="#dfe3ec"/>
    <!-- attached thumbnail inside the composer -->
    <rect x="694" y="318" width="96" height="64" rx="10" fill="#e8edf8" stroke="#cbd5e8"/>
    <path d="M700 372l22-26 14 16 10-12 18 22z" fill="#b9c6e0"/>
    <path d="M780 318l10 10M790 318l-10 10" stroke="#9aa3b4" stroke-width="1.6" stroke-linecap="round"/>
    <text class="cardtitle" x="694" y="400">screenshot-20261121-142501.png</text>
    <!-- tool row -->
    <circle cx="708" cy="424" r="11" fill="none" stroke="#c2cadb" stroke-width="1.8"/>
    <path d="M708 418v12M702 424h12" stroke="#8f9ab0" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="730" y="414" width="98" height="20" rx="10" fill="#eef1f8" stroke="#dde2ee"/>
    <text class="sub" x="742" y="428" font-size="11">截图 · Ctrl+Shift+S</text>
    <rect x="1092" y="410" width="92" height="30" rx="15" fill="#3d5afe"/>
    <text class="send" x="1114" y="430">发送</text>
  </g>
  <text class="sub" x="640" y="542">卡片上的三个词只填提示词，不会自动发送</text>
</svg>
